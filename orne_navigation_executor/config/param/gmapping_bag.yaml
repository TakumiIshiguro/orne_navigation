# GMapping parameters for the ORNE Gamma Hokuyo data recorded in rosbag.
throttle_scans: 1
map_update_interval: 2.0
maxUrange: 29.0
maxRange: 30.0

# Scan matching.
sigma: 0.05
kernelSize: 1
lstep: 0.05
astep: 0.05
iterations: 5
lsigma: 0.075
ogain: 3.0
lskip: 0
minimumScore: 50.0

# Motion model.
srr: 0.1
srt: 0.2
str: 0.1
stt: 0.2
linearUpdate: 0.2
angularUpdate: 0.1
temporalUpdate: 1.0
resampleThreshold: 0.5
particles: 30

# Map geometry. GMapping expands the map when the trajectory leaves this area.
xmin: -20.0
ymin: -20.0
xmax: 20.0
ymax: 20.0
delta: 0.05
occ_thresh: 0.25

# Likelihood sampling.
llsamplerange: 0.01
llsamplestep: 0.01
lasamplerange: 0.005
lasamplestep: 0.005

transform_publish_period: 0.05
tf_delay: 0.05
